<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5EFE6"/>
      <stop offset="100%" stop-color="#EDE4D4"/>
    </linearGradient>
    <linearGradient id="vinyl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2C1810"/>
      <stop offset="100%" stop-color="#1A0E08"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Outer ring - crate edge -->
  <rect x="56" y="56" width="400" height="400" rx="32" fill="none" stroke="#8B5E34" stroke-width="12" opacity="0.3"/>
  <!-- Vinyl record -->
  <circle cx="256" cy="256" r="160" fill="url(#vinyl)"/>
  <!-- Vinyl grooves -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#3D2E1F" stroke-width="0.75" opacity="0.4"/>
  <circle cx="256" cy="256" r="125" fill="none" stroke="#3D2E1F" stroke-width="0.5" opacity="0.3"/>
  <circle cx="256" cy="256" r="110" fill="none" stroke="#3D2E1F" stroke-width="0.75" opacity="0.4"/>
  <circle cx="256" cy="256" r="95" fill="none" stroke="#3D2E1F" stroke-width="0.5" opacity="0.3"/>
  <!-- Label area -->
  <circle cx="256" cy="256" r="56" fill="#8B5E34"/>
  <!-- Label inner ring -->
  <circle cx="256" cy="256" r="48" fill="none" stroke="#A67B52" stroke-width="1.5" opacity="0.5"/>
  <!-- Spindle hole -->
  <circle cx="256" cy="256" r="8" fill="#F5EFE6"/>
  <!-- Light reflection on vinyl -->
  <ellipse cx="200" cy="180" rx="80" ry="20" fill="white" opacity="0.04" transform="rotate(-35 200 180)"/>
</svg>
